name: Publish Python SDK

# Manual only. A version bump is a decision, not a side effect of pushing to
# main — nothing here runs on every commit that happens to touch sdk/python.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: snoopscan-sdk-dist
          path: sdk/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # id-token: write is the whole point — PyPI's Trusted Publisher flow
    # exchanges this run's OIDC token for upload permission, so no PyPI
    # API token is ever generated, copied, or stored as a GitHub secret.
    # One-time setup on pypi.org: the `snoopscan` project's Publishing
    # settings, add a GitHub publisher with owner=SnoopScan,
    # repo=snoopscan, workflow=publish-sdk.yml, environment=pypi.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snoopscan-sdk-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
