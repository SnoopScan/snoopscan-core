[project]
name = "scraping-engine"
version = "0.1.0"
description = "Web scraping, crawling and content-extraction engine"
requires-python = ">=3.12"
# AGPL-3.0 for the open core. Section 13 obliges a network service to offer
# its source to remote users — see /v1/source, which is how we satisfy it.
# The proprietary modules listed in LICENSE-PROPRIETARY are NOT covered by
# this and are excluded from the distribution.
license = "AGPL-3.0-only"
license-files = ["LICENSE"]

# Every dependency here must be MIT / Apache-2.0 / BSD / ISC / MPL-2.0 (constraint C2).
# The licence gate in tools/check_licences.py enforces this in CI. Do not add a
# dependency without checking its licence first.
dependencies = [
    "fastapi>=0.115",          # MIT
    "uvicorn[standard]>=0.32",  # BSD-3-Clause
    "pydantic>=2.9",            # MIT
    "pydantic-settings>=2.6",   # MIT
    "httpx[http2]>=0.27",       # BSD-3-Clause  (tier 0)
    "httpcore>=1.0",            # BSD-3-Clause  (tier 0's byte-counting transport, byte_meter.py)
    "anthropic>=1.0",           # MIT  (structured extraction model; deferred import, optional at runtime)
    "pypdf>=5.0",               # BSD-3-Clause  (/v1/parse PDFs)
    "python-docx>=1.1",         # MIT  (/v1/parse Word documents)
    "python-multipart>=0.0.20", # Apache-2.0  (multipart uploads for /v1/parse)
    "curl_cffi>=0.7",           # MIT           (tier 1)
    "trafilatura>=1.8.0",       # Apache-2.0 from 1.8.0 (earlier is GPLv3+ — pinned)
    "html-to-markdown>=3.12",   # MIT           (structure-preserving conversion base)
    "selectolax>=0.3.21",       # MIT           (fast HTML parsing / classification)
    # 2.1 (Sep 2026) stopped pulling in greenlet, which the async engine and
    # alembic need, and every CI run broke. Pinned to the tested line; the
    # asyncio extra names greenlet explicitly.
    "sqlalchemy[asyncio]>=2.0,<2.1",  # MIT
    "asyncpg>=0.29",            # Apache-2.0  (async app path)
    "alembic>=1.13",            # MIT
    "redis>=5.0",               # MIT
    "rq>=1.16",                 # BSD-3-Clause
    "defusedxml>=0.7",          # PSF-2.0  (sitemaps are attacker-controlled XML)
    "mcp>=2.0",                 # MIT  (the hosted MCP server at /mcp, on by default)
    "dnspython>=2.6",           # ISC  (MX lookups; without it every address is
                                #       assumed deliverable, which is a silent
                                #       downgrade rather than a visible failure)
    "pyyaml>=6.0",              # MIT
    "tldextract>=5.1",          # BSD-3-Clause  (public suffix list)
    "email-validator>=2.2",     # Unlicense/CC0
    "prometheus-client>=0.21",  # Apache-2.0
    "structlog>=24.4",          # MIT/Apache-2.0
    "cryptography>=43.0",       # Apache-2.0 / BSD
]

[project.optional-dependencies]
# Tier 2. Deliberately NOT a core dependency: the open core must install and
# run without it, and a browser pulls ~400MB of Chromium that a self-hoster
# scraping ordinary pages never needs. `uv sync --extra browser` to enable.
browser = [
    "patchright>=1.52",         # Apache-2.0  (tier 2, undetected Playwright fork)
    # The [geoip] extra is part of the spec, not a nicety: without it Camoufox
    # raises on launch whenever geoip=True, which is every proxied request at
    # these rungs. The fetcher degrades rather than dying (tier3h_camoufox.py),
    # but a degraded fingerprint is the thing these rungs exist to avoid.
    "camoufox[geoip]>=0.5",     # MPL-2.0     (tiers 3h/4; needs `python -m camoufox fetch`)
]
dev = [
    "pytest>=8.3",              # MIT
    "pytest-asyncio>=0.24",     # Apache-2.0
    "pytest-cov>=6.0",          # MIT
    "ruff>=0.7",                # MIT
    "mypy>=1.13",               # MIT
    "pip-licenses>=5.0",        # MIT
    "respx>=0.21",              # BSD
    "types-pyyaml",
    "types-defusedxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "C4", "SIM"]
ignore = ["S101"]  # assert used in tests

[tool.ruff.lint.per-file-ignores]
"engine/tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
# Must match the CI invocation, or a local `mypy` run reports clean on a
# scope CI rejects. engine/core alone left the API and workers unchecked, and
# the workers had a live type error nobody saw.
files = ["engine/core", "engine/api", "engine/workers", "engine/logging_config.py"]
plugins = ["pydantic.mypy"]

# asyncpg ships neither stubs nor a py.typed marker. Silenced for that module
# only — our own code on top of it stays strict, and the `Any` it hands back is
# narrowed at each call site rather than allowed to spread.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["engine/tests"]
# Connection pools are built once per module; tests must share that loop or
# asyncpg/redis futures end up attached to a loop that has already closed.
asyncio_default_fixture_loop_scope = "module"
asyncio_default_test_loop_scope = "module"
markers = [
    "integration: needs a live Postgres and Redis; skipped when unavailable",
]
